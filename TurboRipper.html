<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--text:#e8eaf0;--mute:#8b93a5;--acc:#ff4c4c;--ok:#4cd98a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
.wrap{width:100%;max-width:560px}
h1{margin:0 0 4px;font-size:2rem;letter-spacing:-.5px}
h1 span{color:var(--acc)}
p.sub{margin:0 0 20px;color:var(--mute)}
#drop{border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:48px 20px;text-align:center;cursor:pointer;transition:.15s}
#drop.over{border-color:var(--acc);background:#201a1c}
#drop strong{display:block;font-size:1.1rem;margin-bottom:6px}
#drop small{color:var(--mute)}
#status{margin-top:16px;display:none}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#log{margin-top:12px;background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--mute);max-height:180px;overflow:auto;white-space:pre-wrap}
#log .ok{color:var(--ok)} #log .err{color:var(--acc)}
button{margin-top:12px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:.95rem;cursor:pointer;display:none}
#viewer{display:none;width:100%;max-width:1100px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}.vh span{margin-left:8px;font-size:.75rem;color:var(--mute);font-weight:400}
.vb{display:flex;height:560px}
#sprites{width:130px;border-right:1px solid var(--line);overflow:auto;padding:8px;flex:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;cursor:pointer;font-size:.8rem;text-align:center;word-break:break-word;border:2px solid transparent}
.sp.on{border-color:var(--acc);background:#201a1c}.sp img,.noimg{width:56px;height:56px;object-fit:contain}
.vm{flex:1;min-width:0;display:flex;flex-direction:column}
#tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
button.tab{display:inline-block;margin:0;background:none;color:var(--mute);border-radius:8px 8px 0 0;padding:8px 14px}
button.tab.on{background:#0b0d11;color:var(--text)}
#pane{flex:1;overflow:auto;padding:16px;background:#0b0d11}
.scripts{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.stack{display:inline-block;min-width:60px}
.blk{color:#fff;font-size:12px;font-weight:600;padding:6px 8px 4px;border-radius:4px;margin-top:2px;box-shadow:inset 0 -2px rgba(0,0,0,.25)}
.blk.hat{border-radius:20px 20px 4px 4px;padding-top:12px}
.arm{margin:2px 0 2px 14px;padding:2px 0 4px 6px;background:rgba(0,0,0,.2);border-radius:4px}
.row{line-height:26px}
.pill{display:inline-block;padding:0 8px;border-radius:12px;line-height:20px;margin:0 2px;color:#fff;background:rgba(0,0,0,.25);vertical-align:middle}
.pill.lit{background:#fff;color:#333}
.rep{display:inline-block;padding:0 6px;border-radius:14px;margin:0 2px;vertical-align:middle;line-height:22px}
.rep.bool{border-radius:6px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:.8rem}
.card img{max-width:100%;max-height:100px;object-fit:contain}.card audio{width:100%}
.empty{color:var(--mute)}
.scr{margin:0;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#d6dbe8;white-space:pre;tab-size:2}
.segs{margin-left:auto;display:flex;align-self:center;padding-bottom:4px}
button.seg{display:inline-block;margin:0;padding:5px 12px;background:none;color:var(--mute);border:1px solid var(--line);font-size:.8rem;border-radius:0}
button.seg:first-child{border-radius:8px 0 0 8px}
button.seg:last-child{border-radius:0 8px 8px 0}
button.seg.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(max-width:640px){.vb{flex-direction:column;height:auto}#sprites{width:auto;display:flex;border-right:0;border-bottom:1px solid var(--line)}#pane{max-height:60vh}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Turbo<span>Ripper</span></h1>
  <p class="sub">Drop a packaged TurboWarp project (.zip) and get the .sb3 back.</p>
  <div id="drop"><strong>Drag &amp; drop the .zip here</strong><small>or click to choose a file (.html also works)</small></div>
  <input id="file" type="file" accept=".zip,.html,.htm" hidden>
  <div id="status"><div class="bar"><i id="prog"></i></div><div id="log"></div><button id="again">⬇ Download .sb3</button></div>
</div>
<section id="viewer"><div class="vh">Project viewer <span>read-only: code &amp; sprites</span></div>
<div class="vb"><aside id="sprites"></aside><div class="vm"><div id="tabs"></div><div id="pane"></div></div></div></section>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileIn = $('file'), logEl = $('log'), prog = $('prog'), again = $('again');
let lastBlob = null, lastName = 'project.sb3';

const log = (m, c) => { const d = document.createElement('div'); if (c) d.className = c; d.textContent = m; logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; };
const setProg = p => prog.style.width = p + '%';
const base = n => n.split('/').pop();

drop.onclick = () => fileIn.click();
fileIn.onchange = () => fileIn.files[0] && start(fileIn.files[0]);
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) start(f); });
again.onclick = () => lastBlob && save(lastBlob, lastName);

function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function b64ToBytes(s) {
  const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function gunzip(bytes) {
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// Pull balanced JSON object starting at index i
function extractJson(text, i) {
  let depth = 0, inStr = false, esc = false;
  for (let j = i; j < text.length; j++) {
    const c = text[j];
    if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '{') depth++;
    else if (c === '}') { if (--depth === 0) return text.slice(i, j + 1); }
  }
  return null;
}

// Given raw bytes, try to interpret as a project. Returns {type:'sb3',zip} | {type:'json',text} | null
async function interpret(bytes) {
  if (bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b) {
    try { bytes = await gunzip(bytes); } catch { return null; }
  }
  if (bytes[0] === 0x50 && bytes[1] === 0x4b) {
    try {
      const z = await JSZip.loadAsync(bytes);
      if (z.file('project.json')) return { type: 'sb3', zip: z };
    } catch {}
    return null;
  }
  if (bytes[0] === 0x7b) {
    const t = new TextDecoder().decode(bytes);
    try { if (JSON.parse(t).targets) return { type: 'json', text: t }; } catch {}
  }
  return null;
}

async function start(file) {
  $('viewer').style.display = 'none'; $('status').style.display = 'block'; again.style.display = 'none';
  logEl.innerHTML = ''; setProg(3);
  try {
    log('Reading ' + file.name + ' (' + (file.size / 1048576).toFixed(2) + ' MB)');
    const buf = new Uint8Array(await file.arrayBuffer());
    const isZip = buf[0] === 0x50 && buf[1] === 0x4b;
    let entries = [], zip = null;
    if (isZip) {
      zip = await JSZip.loadAsync(buf);
      entries = Object.values(zip.files).filter(f => !f.dir);
      log('Found ' + entries.length + ' files in archive');
    } else {
      entries = [{ name: file.name, async: t => Promise.resolve(t === 'string' ? new TextDecoder().decode(buf) : buf) }];
      log('Not a zip, scanning file as HTML');
    }
    setProg(15);

    let projectJson = null, outZip = null;

    // 1) Ready-made sb3 inside
    const sb3 = entries.find(e => /\.sb3$/i.test(e.name));
    if (sb3) {
      log('Found project file: ' + sb3.name, 'ok');
      const r = await interpret(await sb3.async('uint8array'));
      if (r && r.type === 'sb3') outZip = r.zip;
    }

    // 2) Loose project.json (packager "zip" output)
    if (!outZip) {
      const pj = entries.find(e => /(^|\/)project\.json$/i.test(e.name));
      if (pj) { projectJson = await pj.async('string'); log('Found ' + pj.name, 'ok'); }
    }

    // 3) Embedded inside HTML/JS
    if (!outZip && !projectJson) {
      log('No loose project, scanning HTML/JS for embedded data...');
      const textFiles = entries.filter(e => /\.(html?|js|mjs|json)$/i.test(e.name));
      let n = 0;
      outer: for (const e of textFiles) {
        const text = await e.async('string');
        setProg(15 + 50 * (++n / textFiles.length));
        const re = /[A-Za-z0-9+\/]{2000,}={0,2}/g;
        let m;
        while ((m = re.exec(text))) {
          let bytes; try { bytes = b64ToBytes(m[0]); } catch { continue; }
          const r = await interpret(bytes);
          if (r) {
            log('Extracted embedded project from ' + e.name, 'ok');
            if (r.type === 'sb3') outZip = r.zip; else projectJson = r.text;
            break outer;
          }
        }
        const idx = text.indexOf('{"targets"');
        if (idx >= 0) {
          const j = extractJson(text, idx);
          try { if (j && JSON.parse(j).targets) { projectJson = j; log('Extracted plain JSON project from ' + e.name, 'ok'); break; } } catch {}
        }
      }
    }

    if (!outZip && !projectJson) throw new Error('Could not find a project in this file. Is it a TurboWarp Packager zip?');
    setProg(70);

    // Build sb3
    if (!outZip) {
      outZip = new JSZip();
      outZip.file('project.json', projectJson);
    }
    let added = 0;
    if (isZip) {
      for (const e of entries) {
        const b = base(e.name);
        if (/^[0-9a-f]{32}\.[a-z0-9]+$/i.test(b) && !outZip.file(b)) {
          outZip.file(b, await e.async('uint8array')); added++;
        }
      }
    }
    log('Packed ' + added + ' asset file(s) from archive');
    log('Building .sb3...');
    const blob = await outZip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/x.scratch.sb3' },
      m => setProg(70 + m.percent * 0.29));
    lastBlob = blob;
    lastName = file.name.replace(/\.(zip|html?)$/i, '') + '.sb3';
    setProg(100);
    log('Done! Click the button to download ' + lastName, 'ok');
    try { await loadViewer(outZip); } catch (e) { log('Viewer: ' + e.message, 'err'); }
    again.style.display = 'inline-block';
  } catch (err) {
    console.error(err);
    log('Error: ' + err.message, 'err');
    setProg(0);
  }
  fileIn.value = '';
}

/* ===== Read-only project viewer ===== */
const CAT={motion:'#4c97ff',looks:'#9966ff',sound:'#cf63cf',event:'#ffbf00',control:'#ffab19',sensing:'#5cb1d6',operator:'#59c059',data:'#ff8c1a',procedures:'#ff6680',argument:'#ff6680',pen:'#0fbd8c'};
const BOOL=new Set(['operator_and','operator_or','operator_not','operator_equals','operator_gt','operator_lt','operator_contains','sensing_touchingobject','sensing_touchingcolor','sensing_keypressed','sensing_mousedown','data_listcontainsitem']);
const T={motion_movesteps:'move {STEPS} steps',motion_turnright:'turn \u21bb {DEGREES} degrees',motion_turnleft:'turn \u21ba {DEGREES} degrees',motion_goto:'go to {TO}',motion_gotoxy:'go to x: {X} y: {Y}',motion_glideto:'glide {SECS} secs to {TO}',motion_glidesecstoxy:'glide {SECS} secs to x: {X} y: {Y}',motion_pointindirection:'point in direction {DIRECTION}',motion_pointtowards:'point towards {TOWARDS}',motion_changexby:'change x by {DX}',motion_setx:'set x to {X}',motion_changeyby:'change y by {DY}',motion_sety:'set y to {Y}',motion_ifonedgebounce:'if on edge, bounce',motion_setrotationstyle:'set rotation style {STYLE}',motion_xposition:'x position',motion_yposition:'y position',motion_direction:'direction',
looks_sayforsecs:'say {MESSAGE} for {SECS} seconds',looks_say:'say {MESSAGE}',looks_thinkforsecs:'think {MESSAGE} for {SECS} seconds',looks_think:'think {MESSAGE}',looks_switchcostumeto:'switch costume to {COSTUME}',looks_nextcostume:'next costume',looks_switchbackdropto:'switch backdrop to {BACKDROP}',looks_nextbackdrop:'next backdrop',looks_changesizeby:'change size by {CHANGE}',looks_setsizeto:'set size to {SIZE} %',looks_changeeffectby:'change {EFFECT} effect by {CHANGE}',looks_seteffectto:'set {EFFECT} effect to {VALUE}',looks_cleargraphiceffects:'clear graphic effects',looks_show:'show',looks_hide:'hide',looks_gotofrontback:'go to {FRONT_BACK} layer',looks_goforwardbackwardlayers:'go {FORWARD_BACKWARD} {NUM} layers',looks_costumenumbername:'costume {NUMBER_NAME}',looks_backdropnumbername:'backdrop {NUMBER_NAME}',looks_size:'size',
sound_playuntildone:'play sound {SOUND_MENU} until done',sound_play:'start sound {SOUND_MENU}',sound_stopallsounds:'stop all sounds',sound_changevolumeby:'change volume by {VOLUME}',sound_setvolumeto:'set volume to {VOLUME} %',sound_volume:'volume',
event_whenflagclicked:'when \ud83c\udfc1 clicked',event_whenkeypressed:'when {KEY_OPTION} key pressed',event_whenthisspriteclicked:'when this sprite clicked',event_whenbackdropswitchesto:'when backdrop switches to {BACKDROP}',event_whengreaterthan:'when {WHENGREATERTHANMENU} > {VALUE}',event_whenbroadcastreceived:'when I receive {BROADCAST_OPTION}',event_broadcast:'broadcast {BROADCAST_INPUT}',event_broadcastandwait:'broadcast {BROADCAST_INPUT} and wait',
control_wait:'wait {DURATION} seconds',control_repeat:'repeat {TIMES}',control_forever:'forever',control_if:'if {CONDITION} then',control_if_else:'if {CONDITION} then',control_wait_until:'wait until {CONDITION}',control_repeat_until:'repeat until {CONDITION}',control_while:'while {CONDITION}',control_for_each:'for each {VARIABLE} in {VALUE}',control_stop:'stop {STOP_OPTION}',control_start_as_clone:'when I start as a clone',control_create_clone_of:'create clone of {CLONE_OPTION}',control_delete_this_clone:'delete this clone',
sensing_touchingobject:'touching {TOUCHINGOBJECTMENU} ?',sensing_touchingcolor:'touching color {COLOR} ?',sensing_askandwait:'ask {QUESTION} and wait',sensing_answer:'answer',sensing_keypressed:'key {KEY_OPTION} pressed?',sensing_mousedown:'mouse down?',sensing_mousex:'mouse x',sensing_mousey:'mouse y',sensing_timer:'timer',sensing_resettimer:'reset timer',sensing_distanceto:'distance to {DISTANCETOMENU}',sensing_of:'{PROPERTY} of {OBJECT}',sensing_current:'current {CURRENTMENU}',sensing_dayssince2000:'days since 2000',sensing_username:'username',
operator_add:'{NUM1} + {NUM2}',operator_subtract:'{NUM1} - {NUM2}',operator_multiply:'{NUM1} * {NUM2}',operator_divide:'{NUM1} / {NUM2}',operator_random:'pick random {FROM} to {TO}',operator_gt:'{OPERAND1} > {OPERAND2}',operator_lt:'{OPERAND1} < {OPERAND2}',operator_equals:'{OPERAND1} = {OPERAND2}',operator_and:'{OPERAND1} and {OPERAND2}',operator_or:'{OPERAND1} or {OPERAND2}',operator_not:'not {OPERAND}',operator_join:'join {STRING1} {STRING2}',operator_letter_of:'letter {LETTER} of {STRING}',operator_length:'length of {STRING}',operator_contains:'{STRING1} contains {STRING2}?',operator_mod:'{NUM1} mod {NUM2}',operator_round:'round {NUM}',operator_mathop:'{OPERATOR} of {NUM}',
data_setvariableto:'set {VARIABLE} to {VALUE}',data_changevariableby:'change {VARIABLE} by {VALUE}',data_showvariable:'show variable {VARIABLE}',data_hidevariable:'hide variable {VARIABLE}',data_addtolist:'add {ITEM} to {LIST}',data_deleteoflist:'delete {INDEX} of {LIST}',data_deletealloflist:'delete all of {LIST}',data_insertatlist:'insert {ITEM} at {INDEX} of {LIST}',data_replaceitemoflist:'replace item {INDEX} of {LIST} with {ITEM}',data_itemoflist:'item {INDEX} of {LIST}',data_lengthoflist:'length of {LIST}',data_listcontainsitem:'{LIST} contains {ITEM}?',data_itemnumoflist:'item # of {ITEM} in {LIST}',
pen_clear:'erase all',pen_stamp:'stamp',pen_penDown:'pen down',pen_penUp:'pen up',pen_setPenColorToColor:'set pen color to {COLOR}',pen_changePenSizeBy:'change pen size by {SIZE}',pen_setPenSizeTo:'set pen size to {SIZE}'};
const MIME={svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',wav:'audio/wav',mp3:'audio/mpeg',ogg:'audio/ogg'};
let P=null,B={},assetURL={},curT=0,curTab='code',curMode='blocks';
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const catOf=op=>CAT[op.split('_')[0]]||'#8a8a99';
const human=op=>op.replace(/^[A-Za-z0-9]+_/,'').replace(/_/g,' ');
const pill=(x,bg,cls)=>{const s=mk('span','pill '+(cls||''),x);if(bg)s.style.background=bg;return s;};
const aurl=c=>c&&assetURL[c.md5ext||(c.assetId+'.'+c.dataFormat)];

function renderInput(b,name){
  const v=b.inputs&&b.inputs[name];
  if(v){
    const x=v[1];
    if(Array.isArray(x)){
      if(x[0]===12||x[0]===13)return pill(x[1],'#ff8c1a');
      if(x[0]===11)return pill(x[1],'#ffbf00');
      if(x[0]===9){const s=mk('span','pill','\u00a0\u00a0\u00a0');s.style.background=x[1];return s;}
      return pill(x[1]===''?'\u00a0':x[1],null,'lit');
    }
    if(typeof x==='string'&&B[x])return reporter(B[x]);
    return Array.isArray(v[2])?pill(v[2][1]===''?'\u00a0':v[2][1],null,'lit'):pill('\u00a0',null,'lit');
  }
  const f=b.fields&&b.fields[name];
  return f?pill(f[0],null,'menu'):null;
}
function reporter(b){
  if(Array.isArray(b))return pill(b[1],'#ff8c1a');
  const op=b.opcode,f=b.fields||{};
  if(op==='data_variable')return pill(f.VARIABLE[0],'#ff8c1a');
  if(op==='data_listcontents')return pill(f.LIST[0],'#ff5a1a');
  if(op.startsWith('argument_reporter'))return pill(f.VALUE[0],'#ff6680');
  if(b.shadow&&!Object.keys(b.inputs||{}).length&&Object.keys(f).length===1)return pill(Object.values(f)[0][0],null,'menu');
  const s=mk('span','rep'+(BOOL.has(op)?' bool':''));
  s.style.background=catOf(op);label(b,s);return s;
}
function fill(p,str,fn){
  String(str).split(/(\{\w+\}|%[sb])/).forEach(s=>{
    if(!s)return;
    const k=/^\{(\w+)\}$/.test(s)||/^%[sb]$/.test(s);
    if(k){const n=fn(s);if(n)p.append(n);}else p.append(s);
  });
}
function label(b,p){
  const op=b.opcode,m=b.mutation||{};
  if(op==='procedures_call'){
    let ids=[],i=0;try{ids=JSON.parse(m.argumentids)}catch{}
    fill(p,m.proccode||'custom block',()=>renderInput(b,ids[i++]));return;
  }
  if(op==='procedures_prototype'){
    let nm=[],i=0;try{nm=JSON.parse(m.argumentnames)}catch{}
    fill(p,m.proccode||'',()=>pill(nm[i++]||'arg','#ff3355'));return;
  }
  if(op==='procedures_definition'){
    p.append('define ');const pr=B[b.inputs.custom_block[1]];if(pr)label(pr,p);return;
  }
  if(T[op]){fill(p,T[op],s=>renderInput(b,s.slice(1,-1)));return;}
  p.append(human(op));
  for(const k in b.inputs||{}){if(/^SUBSTACK/.test(k))continue;const n=renderInput(b,k);if(n){p.append(' ');p.append(n);}}
  for(const k in b.fields||{}){p.append(' ');p.append(pill(b.fields[k][0],null,'menu'));}
}
const arm=id=>{const a=mk('div','arm');if(id&&B[id])a.append(stack(id));return a;};
function blockEl(b){
  const op=b.opcode,inp=b.inputs||{};
  const d=mk('div','blk'+(/^event_when/.test(op)||op==='control_start_as_clone'||op==='procedures_definition'?' hat':''));
  d.style.background=catOf(op);
  const r=mk('div','row');label(b,r);d.append(r);
  if(/^control_(if|if_else|forever|repeat|repeat_until|while|for_each)$/.test(op)||inp.SUBSTACK){
    d.append(arm(inp.SUBSTACK&&inp.SUBSTACK[1]));
    if(op==='control_if_else'||inp.SUBSTACK2){d.append(mk('div','row','else'));d.append(arm(inp.SUBSTACK2&&inp.SUBSTACK2[1]));}
  }
  return d;
}
function stack(id){
  const s=mk('div','stack');
  while(id&&B[id]&&!Array.isArray(B[id])){const b=B[id];s.append(blockEl(b));id=b.next;}
  return s;
}
function tInput(b,name){
  const v=b.inputs&&b.inputs[name];
  if(v){
    const x=v[1];
    if(Array.isArray(x)){
      if(x[0]===12||x[0]===13)return '$'+x[1];
      if(x[0]===11)return '['+x[1]+']';
      if(x[0]===10||String(x[1])==='')return JSON.stringify(String(x[1]));
      return String(x[1]);
    }
    if(typeof x==='string'&&B[x])return tRep(B[x]);
    return Array.isArray(v[2])?(v[2][0]===10?JSON.stringify(String(v[2][1])):String(v[2][1])):'""';
  }
  const f=b.fields&&b.fields[name];
  return f?'['+f[0]+']':null;
}
function tRep(b){
  if(Array.isArray(b))return '$'+b[1];
  const op=b.opcode,f=b.fields||{};
  if(op==='data_variable')return '$'+f.VARIABLE[0];
  if(op==='data_listcontents')return '$'+f.LIST[0];
  if(op.startsWith('argument_reporter'))return '@'+f.VALUE[0];
  if(b.shadow&&!Object.keys(b.inputs||{}).length&&Object.keys(f).length===1)return '['+Object.values(f)[0][0]+']';
  const s=tLabel(b);
  return BOOL.has(op)?'<'+s+'>':'('+s+')';
}
function tFill(str,fn){return String(str).replace(/\{\w+\}|%[sb]/g,s=>{const n=fn(s);return n==null?'':n;});}
function tLabel(b){
  const op=b.opcode,m=b.mutation||{};
  if(op==='procedures_call'){let ids=[],i=0;try{ids=JSON.parse(m.argumentids)}catch{}return tFill(m.proccode||'custom block',()=>tInput(b,ids[i++]));}
  if(op==='procedures_prototype'){let nm=[],i=0;try{nm=JSON.parse(m.argumentnames)}catch{}return tFill(m.proccode||'',()=>'@'+(nm[i++]||'arg'));}
  if(op==='procedures_definition'){const pr=B[b.inputs.custom_block[1]];return 'define '+(pr?tLabel(pr):'');}
  if(T[op])return tFill(T[op],s=>tInput(b,s.slice(1,-1)));
  let out=human(op);
  for(const k in b.inputs||{}){if(/^SUBSTACK/.test(k))continue;const n=tInput(b,k);if(n!=null)out+=' '+n;}
  for(const k in b.fields||{})out+=' ['+b.fields[k][0]+']';
  return out;
}
function tStack(id,ind,out){
  const pad='  '.repeat(ind);
  while(id&&B[id]&&!Array.isArray(B[id])){
    const b=B[id],op=b.opcode,inp=b.inputs||{};
    if(/^control_(if|if_else|forever|repeat|repeat_until|while|for_each)$/.test(op)||inp.SUBSTACK){
      out.push(pad+tLabel(b)+' {');
      tStack(inp.SUBSTACK&&inp.SUBSTACK[1],ind+1,out);
      if(op==='control_if_else'||inp.SUBSTACK2){out.push(pad+'} else {');tStack(inp.SUBSTACK2&&inp.SUBSTACK2[1],ind+1,out);}
      out.push(pad+'}');
    }else out.push(pad+tLabel(b));
    id=b.next;
  }
  return out;
}
function codePane(t,pane){
  B=t.blocks||{};
  const ids=Object.keys(B).filter(i=>!Array.isArray(B[i])&&B[i].topLevel&&!B[i].shadow).sort((a,b)=>((B[a].y|0)-(B[b].y|0))||((B[a].x|0)-(B[b].x|0)));
  if(!ids.length){pane.append(mk('p','empty','No scripts here.'));return;}
  if(curMode==='script'){
    const lines=[];
    ids.forEach(i=>{
      const b=B[i];
      if(/^event_when/.test(b.opcode)||b.opcode==='control_start_as_clone'||b.opcode==='procedures_definition'){lines.push(tLabel(b));tStack(b.next,1,lines);}
      else tStack(i,0,lines);
      lines.push('');
    });
    const pre=mk('pre','scr');pre.textContent=lines.join('\n').trim();pane.append(pre);return;
  }
  const w=mk('div','scripts');ids.forEach(i=>w.append(stack(i)));pane.append(w);
}
function listPane(t,pane,kind){
  const arr=t[kind]||[];
  if(!arr.length){pane.append(mk('p','empty','Nothing here.'));return;}
  const g=mk('div','grid');
  arr.forEach(a=>{
    const c=mk('div','card'),u=aurl(a);
    if(kind==='costumes'){const i=mk('img');if(u)i.src=u;c.append(i);}
    else{const au=mk('audio');au.controls=true;if(u)au.src=u;c.append(au);}
    c.append(mk('div',null,a.name));g.append(c);
  });
  pane.append(g);
}
function draw(){
  const t=P.targets[curT],sp=$('sprites'),tabs=$('tabs'),pane=$('pane');
  sp.innerHTML=tabs.innerHTML=pane.innerHTML='';
  P.targets.forEach((x,i)=>{
    const d=mk('div','sp'+(i===curT?' on':'')),u=aurl(x.costumes&&x.costumes[0]);
    if(u){const im=mk('img');im.src=u;d.append(im);}else d.append(mk('div','noimg'));
    d.append(mk('span',null,x.isStage?'Stage':x.name));
    d.onclick=()=>{curT=i;draw();};sp.append(d);
  });
  [['code','Code'],['costumes',t.isStage?'Backdrops':'Costumes'],['sounds','Sounds']].forEach(([k,n])=>{
    const b=mk('button','tab'+(k===curTab?' on':''),n);b.onclick=()=>{curTab=k;draw();};tabs.append(b);
  });
  if(curTab==='code'){
    const g=mk('div','segs');
    [['blocks','Blocks'],['script','Script']].forEach(([k,n])=>{const b=mk('button','seg'+(k===curMode?' on':''),n);b.onclick=()=>{curMode=k;draw();};g.append(b);});
    tabs.append(g);
  }
  if(curTab==='code')codePane(t,pane);else listPane(t,pane,curTab);
}
async function loadViewer(z){
  P=JSON.parse(await z.file('project.json').async('string'));
  if(!P.targets)throw new Error('project.json has no targets');
  Object.values(assetURL).forEach(URL.revokeObjectURL);assetURL={};
  for(const f of Object.values(z.files)){
    if(f.dir||f.name==='project.json')continue;
    const ext=f.name.split('.').pop().toLowerCase();
    assetURL[f.name]=URL.createObjectURL(new Blob([await f.async('uint8array')],{type:MIME[ext]||'application/octet-stream'}));
  }
  curT=0;curTab='code';draw();
  $('viewer').style.display='block';
  log('Viewer ready: ' + P.targets.length + ' targets','ok');
}
